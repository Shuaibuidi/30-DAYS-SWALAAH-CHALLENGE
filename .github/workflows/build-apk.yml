
name: Build 30 Days Swalaah Challenge APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'icon.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android sharp

      - name: Create Android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npx cap init "30 Days Swalaah Challenge" "com.siatech.swalaahchallenge" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Generate launcher icons
        run: |
          node --input-type=module <<'EOF'
          import sharp from 'sharp';
          import fs from 'fs';

          const base = 'android/app/src/main/res';

          const sizes = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192
          };

          for (const [folder, size] of Object.entries(sizes)) {
            const dir = `${base}/${folder}`;
            fs.mkdirSync(dir, { recursive: true });

            for (const name of ['ic_launcher.png', 'ic_launcher_round.png']) {
              await sharp('icon.png')
                .resize(size, size, { fit: 'cover' })
                .png()
                .toFile(`${dir}/${name}`);
            }
          }

          fs.mkdirSync(`${base}/drawable`, { recursive: true });
          fs.mkdirSync(`${base}/values`, { recursive: true });
          fs.mkdirSync(`${base}/mipmap-anydpi-v26`, { recursive: true });

          await sharp('icon.png')
            .resize(432, 432, { fit: 'contain', background: '#087A45' })
            .png()
            .toFile(`${base}/drawable/ic_launcher_foreground.png`);

          fs.writeFileSync(
            `${base}/values/ic_launcher_background.xml`,
            '<resources><color name="ic_launcher_background">#087A45</color></resources>'
          );

          const xml = `<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>`;

          fs.writeFileSync(`${base}/mipmap-anydpi-v26/ic_launcher.xml`, xml);
          fs.writeFileSync(`${base}/mipmap-anydpi-v26/ic_launcher_round.xml`, xml);

          const manifest = 'android/app/src/main/AndroidManifest.xml';
          let content = fs.readFileSync(manifest, 'utf8');
          content = content.replace(/android:icon="[^"]+"/, 'android:icon="@mipmap/ic_launcher"');
          content = content.replace(/android:roundIcon="[^"]+"/, 'android:roundIcon="@mipmap/ic_launcher_round"');

          if (!content.includes('android:roundIcon=')) {
            content = content.replace(
              /android:icon="@mipmap\/ic_launcher"/,
              'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"'
            );
          }

          fs.writeFileSync(manifest, content);
          EOF

      - name: Fix Kotlin dependencies
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {
                  resolutionStrategy.force(
                      'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
                      'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
                      'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  )
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 30-Days-Swalaah-Challenge-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
